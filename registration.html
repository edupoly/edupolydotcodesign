<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap 5.3 Modal Form</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom primary color */
        .btn-primary,
        .bg-primary {
            background: linear-gradient(to right bottom, #817bf0, blue);
            /* Custom purple */
            border-color: #6c63ff !important;
        }

        .btn-primary:hover {
            background-color: #5a54d6 !important;
            border-color: #5a54d6 !important;
        }

        /* Compact form spacing */
        .modal-body .form-control {
            padding: 0.4rem 0.6rem;
            font-size: 0.9rem;
        }

        .modal-body .form-label {
            margin-bottom: 0.2rem;
            font-size: 0.9rem;
        }

        .modal-body .mb-3 {
            margin-bottom: 0.7rem !important;
        }

        /* Adjust modal width for small screens */
        @media (max-width: 576px) {
            .modal-dialog {
                margin: 0.5rem;
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Button to trigger modal -->
    <div class="container mt-3 text-center">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#contactModal">
            Open Contact Form
        </button>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="contactModalLabel">Contact Us</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <form action="https://edupoly.in/myform.php" method="POST">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="name" class="form-label"><b>Full Name</b></label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label"><b>Email Address</b></label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label"><b>Phone Number</b> (optional)</label>
                            <input type="text" class="form-control" id="phone" name="phone">
                        </div>

                        <div class="mb-3">
                            <label for="subject" class="form-label"><b>Subject</b></label>
                            <input type="text" class="form-control" id="subject" name="subject" required>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label"><b>Message</b></label>
                            <textarea class="form-control" id="message" name="message" rows="3" required></textarea>
                        </div>
                    </div>

                    <div class="modal-footer p-2">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-success btn-sm">Send Message</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
